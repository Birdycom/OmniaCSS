name: Release VS Code extension

# Same tag as the npm release (v*). Publishes OmniaCSS IntelliSense to the VS Code Marketplace (VS Code)
# and Open VSX (Cursor, VSCodium, Windsurf); editors then update the extension automatically.
# Secrets: VSCE_PAT (Azure DevOps token, scope Marketplace > Manage) and OVSX_PAT (open-vsx.org token).
# A registry whose secret is missing is skipped. The .vsix is also kept as a workflow artifact.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HAS_VSCE: ${{ secrets.VSCE_PAT != '' }}
      HAS_OVSX: ${{ secrets.OVSX_PAT != '' }}
      # README pictures: the Marketplace needs public URLs. Defaults to this repo at the tag;
      # set the repo variable VSCODE_IMAGES_URL to host them elsewhere.
      IMAGES_URL: ${{ vars.VSCODE_IMAGES_URL || format('https://raw.githubusercontent.com/{0}/{1}/packages/vscode', github.repository, github.ref_name) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Check tag matches extension version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          V=$(node -p "require('./packages/vscode/package.json').version")
          if [ "v$V" != "${GITHUB_REF_NAME}" ]; then echo "Tag ${GITHUB_REF_NAME} != extension version v$V"; exit 1; fi

      # The index is built from packages/core/dist.
      - run: npm run build:packages
      - run: npm run vscode:test

      - name: Package
        working-directory: packages/vscode
        run: |
          npx --yes @vscode/vsce@3 package --no-dependencies \
            --baseImagesUrl "$IMAGES_URL" --baseContentUrl "$IMAGES_URL" \
            --out omniacss-intellisense.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: omniacss-intellisense
          path: packages/vscode/omniacss-intellisense.vsix

      - name: Publish to the VS Code Marketplace
        if: env.HAS_VSCE == 'true'
        working-directory: packages/vscode
        run: npx --yes @vscode/vsce@3 publish --packagePath omniacss-intellisense.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX
        if: env.HAS_OVSX == 'true'
        working-directory: packages/vscode
        run: npx --yes ovsx@0.10 publish omniacss-intellisense.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
