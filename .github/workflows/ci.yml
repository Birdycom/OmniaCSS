name: Omniacss CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Build (SCSS -> CSS, packages, docs site) + CLI and migrate tests. Does not need the OmniaUI repo:
      # the docs site uses the vendored OmniaUI CSS in public/css.
      - name: Run test pipeline
        run: npm test

      - name: Check docs pages
        run: npm run docs:check

      - name: Run npm audit (production)
        run: npm audit --omit=dev --audit-level=high
